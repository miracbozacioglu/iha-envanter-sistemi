<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050908" />
    <meta
      name="description"
      content="İHA bakım ve parça envanteri yönetim paneli."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>İHA Envanter Sistemi</title>
    <script>
      /*
       * Tema sınıfını ilk boyamadan ÖNCE koyar; aksi halde açık tema seçmiş
       * kullanıcı her yüklemede bir kare koyu ekran görürdü. Anahtar ve
       * varsayılan src/context/theme-context.ts ile aynı kalmalı.
       */
      (function () {
        var tema = 'dark';
        try {
          var kayitli = localStorage.getItem('iha-envanter:tema');
          if (kayitli === 'light' || kayitli === 'dark') tema = kayitli;
        } catch (e) {
          /* storage kapalı: varsayılanla devam */
        }
        document.documentElement.classList.add(tema);
        if (tema === 'light') {
          document.querySelector('meta[name="theme-color"]').content = '#ECF1EF';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
