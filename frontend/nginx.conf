server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # --- Guvenlik basliklari ---
  # add_header direktifleri ic bloklarda MIRAS ALINMAZ: bir location kendi
  # add_header'ini tanimlarsa ustteki tum basliklar o blokta duser. Bu yuzden
  # asagidaki /assets/ ve /index.html bloklarinda da tekrarlaniyorlar.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # CSP: script/style yalnizca kendi kaynagimizdan. index.html'deki tema
  # betigi satir ici oldugu icin script-src'de 'unsafe-inline' gerekiyor;
  # Tailwind de satir ici stil uretiyor. connect-src backend adresini de
  # kapsamali, bu yuzden bilerek genis birakildi ('*' yerine http/https).
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' http: https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

  # nginx surumunu yanit basliginda duyurmayalim.
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Hash'li varliklar icerik degisince yeni ad aliyor: uzun sureli cache guvenli.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri =404;
  }

  # index.html cache'lenmemeli, aksi halde yeni derleme kullaniciya gec ulasir.
  location = /index.html {
    add_header Cache-Control "no-store";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' http: https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
  }

  # React Router istemci tarafinda calisiyor: /parcalar/12 gibi yollar sunucuda
  # dosya olarak yok, hepsi index.html'e dusmeli. Aksi halde sayfa yenilendiginde
  # veya adres dogrudan yazildiginda nginx 404 verir.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
